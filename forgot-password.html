<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Arcade Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page forgot-page">
      <div class="logo-wrap">
        <img class="logo-image" src="pics/Logo.png" alt="Arcade Vault Blue Studio logo" />
      </div>

      <section class="login-panel" aria-label="Reset password">
        <div class="title">
          <span class="welcome">Forgot Password</span>
        </div>

        <p class="forgot-description">Enter your email and we’ll send you<br class="desktop-break" /> a 5-digit verification code instantly</p>

        <form class="login-box" action="#" method="post">
          <div class="field">
            <label for="email">Email Address*</label>
            <input id="email" type="email" name="email" autocomplete="email" required />
          </div>

          <button class="signin-btn" type="submit">Send Code</button>
        </form>

        <div class="signup"><span>Already have an account?</span><a href="login.html">Sign In</a></div>
      </section>
    </main>
  </body>
</html>
