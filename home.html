<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | Arcade Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body class="arcade-home">
    <main class="home-main">
      <div class="home-toolbar">
        <h1 class="home-greeting">Hi<span class="home-user-name" data-user-name hidden></span></h1>

        <nav class="home-actions" aria-label="Main navigation">
          <a class="home-action is-active" href="home.html" aria-label="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></svg>
          </a>
          <a class="home-action" href="search.html" aria-label="Search games">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.4"/><path d="m16.3 16.3 5 5"/></svg>
          </a>
          <a class="home-action" href="recommendations.html" aria-label="Recommendations">
            <img src="pics/brain%20logo.png" alt="" aria-hidden="true" />
          </a>
          <a class="home-action" href="profile.html" aria-label="Profile">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          </a>
        </nav>
      </div>

      <nav class="category-list" aria-label="Game categories">
        <button class="category-chip is-selected" type="button" aria-pressed="true">Christian</button>
        <button class="category-chip" type="button" aria-pressed="false">Action</button>
        <button class="category-chip" type="button" aria-pressed="false">Horror</button>
        <button class="category-chip" type="button" aria-pressed="false">Romance</button>
        <button class="category-chip" type="button" aria-pressed="false">Adventure</button>
        <button class="category-chip" type="button" aria-pressed="false">Strategy</button>
        <button class="category-chip" type="button" aria-pressed="false">Puzzle</button>
        <button class="category-chip" type="button" aria-pressed="false">RPG</button>
        <button class="category-chip" type="button" aria-pressed="false">Simulation</button>
        <button class="category-chip" type="button" aria-pressed="false">Sport</button>
        <button class="category-chip" type="button" aria-pressed="false">Racing</button>
        <button class="category-chip" type="button" aria-pressed="false">Casual</button>
        <button class="category-chip" type="button" aria-pressed="false">Educational</button>
        <button class="category-chip" type="button" aria-pressed="false">Multiplayer</button>
        <button class="category-chip" type="button" aria-pressed="false">Survival</button>
        <button class="category-chip" type="button" aria-pressed="false">Comedy</button>
        <button class="category-chip" type="button" aria-pressed="false">Drama</button>
        <button class="category-chip" type="button" aria-pressed="false">Mecha</button>
        <button class="category-chip" type="button" aria-pressed="false">Music</button>
        <button class="category-chip" type="button" aria-pressed="false">Mystery</button>
        <button class="category-chip" type="button" aria-pressed="false">Psychological</button>
        <button class="category-chip" type="button" aria-pressed="false">Sci-Fi</button>
        <button class="category-chip" type="button" aria-pressed="false">Slice of Life</button>
        <button class="category-chip" type="button" aria-pressed="false">Supernatural</button>
        <button class="category-chip" type="button" aria-pressed="false">Thriller</button>
        <button class="category-chip" type="button" aria-pressed="false">Fantasy</button>
        <button class="category-chip" type="button" aria-pressed="false">Islam</button>
        <button class="category-chip" type="button" aria-pressed="false">Judaism</button>
        <button class="category-chip" type="button" aria-pressed="false">Buddhism</button>
        <button class="category-chip" type="button" aria-pressed="false">Hinduism</button>
        <button class="category-chip" type="button" aria-pressed="false">Greek Mythology</button>
        <button class="category-chip" type="button" aria-pressed="false">Norse Mythology</button>
        <button class="category-chip" type="button" aria-pressed="false">Egyptian Mythology</button>
        <button class="category-chip" type="button" aria-pressed="false">Japanese Mythology</button>
        <button class="category-chip" type="button" aria-pressed="false">Indian Mythology</button>
        <button class="category-chip" type="button" aria-pressed="false">Chinese Mythology</button>
        <button class="category-chip" type="button" aria-pressed="false">Southeast Asian Mythology</button>
      </nav>

      <p class="game-status" id="game-status" role="status" aria-live="polite">Loading games…</p>

      <section class="game-grid" id="game-grid" aria-label="Games" aria-busy="true">
        <div class="game-card-skeleton" aria-hidden="true">
          <div class="skeleton-cover"></div>
          <div class="skeleton-line skeleton-title"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line skeleton-short"></div>
        </div>
        <div class="game-card-skeleton" aria-hidden="true">
          <div class="skeleton-cover"></div>
          <div class="skeleton-line skeleton-title"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line skeleton-short"></div>
        </div>
        <div class="game-card-skeleton" aria-hidden="true">
          <div class="skeleton-cover"></div>
          <div class="skeleton-line skeleton-title"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line skeleton-short"></div>
        </div>
        <div class="game-card-skeleton" aria-hidden="true">
          <div class="skeleton-cover"></div>
          <div class="skeleton-line skeleton-title"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line skeleton-short"></div>
        </div>
        <div class="game-card-skeleton" aria-hidden="true">
          <div class="skeleton-cover"></div>
          <div class="skeleton-line skeleton-title"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line skeleton-short"></div>
        </div>
        <div class="game-card-skeleton" aria-hidden="true">
          <div class="skeleton-cover"></div>
          <div class="skeleton-line skeleton-title"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line skeleton-short"></div>
        </div>
      </section>
      <button class="load-more-games" id="load-more-games" type="button" hidden>
        Load more games
      </button>
      <p class="game-attribution">
        Game metadata by <a href="https://rawg.io/" target="_blank" rel="noopener noreferrer">RAWG</a>.
        Steam and Epic Games Store prices and availability may change.
      </p>

      <template id="game-card-template">
        <article class="game-card">
          <button class="game-card-favorite" type="button" data-requires-login aria-pressed="false" aria-label="Save game to favorites">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.1-8.8 11-8.8 11s-8.8-5.9-8.8-11A4.8 4.8 0 0 1 12 6.5a4.8 4.8 0 0 1 8.8 2.3Z"/></svg>
          </button>
          <a class="game-card-image-link" data-game-image-link>
            <img class="game-card-image" data-game-image alt="" />
          </a>
          <h2 class="game-card-title" data-game-title><a data-game-title-link></a></h2>
          <p class="game-card-category" data-game-category></p>
          <p class="game-card-description" data-game-description></p>
          <div class="game-card-genres" data-game-genres></div>
          <p class="game-card-rating" data-game-rating></p>
          <div class="game-card-store" data-game-store></div>
        </article>
      </template>
    </main>

    <script src="game-data.js" defer></script>
  </body>
</html>
