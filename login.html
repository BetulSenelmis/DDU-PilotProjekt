<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade Vault Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page login-page">
      <div class="logo-wrap">
        <img class="logo-image" src="pics/Logo.png" alt="Arcade Vault Blue Studio logo" />
      </div>

      <section class="login-panel" aria-label="Sign in">
        <div class="title">
          <span class="welcome">WELCOME BACK!</span>
        </div>

        <form class="login-box" data-auth-form="login">
          <div class="field">
            <input type="text" name="username" placeholder="USERNAME/EMAIL ADDRESS*" aria-label="Username or email address" autocomplete="username" required />
          </div>

          <div class="field password">
            <input id="password" type="password" name="password" placeholder="PASSWORD*" aria-label="Password" autocomplete="current-password" required />
            <button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
                <path class="eye-slash" d="m3 3 18 18" />
              </svg>
            </button>
          </div>

          <div class="options">
            <label class="remember">
              <input type="checkbox" name="remember" />
              <span>Remember me</span>
            </label>

            <a class="forgot" href="forgot-password.html">Forgot password?</a>
          </div>

          <button class="signin-btn" type="submit">Sign In</button>
          <p class="auth-message" data-auth-message role="status" aria-live="polite"></p>
        </form>

        <div class="divider"><span>Or Continue With</span></div>

        <div class="socials" aria-label="Sign in with social accounts">
          <a href="#" class="social google" aria-label="Continue with Google">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09Z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.15v2.84A11 11 0 0 0 12 23Z"/>
              <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.15a11 11 0 0 0 0 9.88l3.69-2.84Z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.99 14.96 1 12 1a11 11 0 0 0-9.85 6.06l3.69 2.84C6.71 7.31 9.14 5.38 12 5.38Z"/>
            </svg>
          </a>
          <a href="#" class="social apple" aria-label="Continue with Apple">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M16.37 12.6c.02 2.2 1.93 2.93 1.95 2.94-.02.05-.3 1.04-.99 2.06-.6.88-1.23 1.75-2.22 1.77-.97.02-1.29-.57-2.4-.57-1.1 0-1.46.55-2.37.59-.95.04-1.67-.95-2.28-1.82-1.24-1.8-2.19-5.08-.92-7.3a3.54 3.54 0 0 1 2.98-1.81c.93-.02 1.8.63 2.37.63.56 0 1.63-.78 2.74-.67.47.02 1.8.19 2.65 1.43-.07.05-1.58.92-1.56 2.75ZM14.56 6.6c.5-.6.84-1.43.75-2.26-.72.03-1.6.48-2.12 1.08-.47.54-.88 1.38-.77 2.19.8.06 1.63-.4 2.14-1.01Z"/>
            </svg>
          </a>
          <a href="#" class="social facebook" aria-label="Continue with Facebook">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M13.36 21v-8.2h2.76l.41-3.2h-3.17V7.56c0-.93.26-1.56 1.6-1.56h1.7V3.14c-.3-.04-1.34-.14-2.55-.14-2.52 0-4.24 1.54-4.24 4.37V9.6H7.02v3.2h2.85V21h3.49Z"/>
            </svg>
          </a>
        </div>

        <div class="signup"><span>Don't have an account?</span><a href="signup.html">Sign Up</a></div>
      </section>
    </main>

    <script src="script.js" defer></script>
    <script src="auth-ui.js" defer></script>
  </body>
</html>
